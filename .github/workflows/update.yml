name: update

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AyuGram release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(scripts/update.sh)
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and start build
        if: steps.up.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.up.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ayugram-desktop: Update to $NEW."
          git push
          # Pushes made with GITHUB_TOKEN start no workflows; dispatch does.
          gh workflow run build.yml --ref "${GITHUB_REF_NAME}"
