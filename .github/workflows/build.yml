name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'channels-lock.scm'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Check signing key secret
        env:
          SIGNING_KEY_SEC: ${{ secrets.GUIX_SIGNING_KEY_SEC }}
        run: test -n "$SIGNING_KEY_SEC" || { echo "::error::GUIX_SIGNING_KEY_SEC secret missing"; exit 1; }

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules \
            /opt/microsoft /opt/google /usr/lib/jvm
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile || true
          df -h /

      - name: Read package version
        id: ver
        run: |
          v=$(sed -n 's/^(define %ayugram-version "\(.*\)")$/\1/p' modules/ayugram/packages/ayugram.scm)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Guix
        run: scripts/ci-install-guix.sh

      - name: Install signing key
        env:
          SIGNING_KEY_SEC: ${{ secrets.GUIX_SIGNING_KEY_SEC }}
        run: |
          printf '%s\n' "$SIGNING_KEY_SEC" | sudo tee /etc/guix/signing-key.sec >/dev/null
          sudo cp signing-key.pub /etc/guix/signing-key.pub
          sudo chmod 600 /etc/guix/signing-key.sec
          sudo chmod 644 /etc/guix/signing-key.pub
          sudo "$(command -v guix)" archive --authorize < signing-key.pub

      - name: Restore pulled Guix
        id: guixcache
        uses: actions/cache/restore@v4
        with:
          path: guix-current
          key: guix-current-${{ hashFiles('channels-lock.scm') }}-v1

      - name: Pull pinned Guix
        run: |
          mkdir -p "$HOME/.config/guix"
          if [ -f guix-current/path ]; then
            # Reuse the Guix built by an earlier run for the same lock file.
            sudo "$(command -v guix)" archive --import < guix-current/closure.nar
            ln -sfn "$(cat guix-current/path)" "$HOME/.config/guix/current"
          else
            guix pull --fallback -C channels-lock.scm
            mkdir -p guix-current
            p=$(readlink -f "$HOME/.config/guix/current")
            echo "$p" > guix-current/path
            guix archive --export -r "$p" > guix-current/closure.nar
          fi
          echo "$HOME/.config/guix/current/bin" >> "$GITHUB_PATH"
          "$HOME/.config/guix/current/bin/guix" describe

      - name: Save pulled Guix
        if: steps.guixcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: guix-current
          key: guix-current-${{ hashFiles('channels-lock.scm') }}-v1

      - name: Build
        id: build
        run: |
          start=$(date +%s)
          guix build -L modules --fallback --cores=4 --max-jobs=2 \
            --verbosity=1 ayugram-desktop | tee out.txt
          out=$(grep '^/gnu/store/.*-ayugram-desktop-' out.txt | tail -1)
          test -n "$out"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "minutes=$(( ($(date +%s) - start) / 60 ))" >> "$GITHUB_OUTPUT"
          df -h /

      - name: Collect failed build log
        if: failure() && steps.build.outcome == 'failure'
        run: |
          mkdir -p logs
          sudo sh -c 'ls -t /var/log/guix/drvs/*/*' | head -5 | while read f; do
            n=$(basename "$f")
            case "$f" in
              *.bz2) sudo bzcat "$f" > "logs/$n.log" ;;
              *.gz) sudo zcat "$f" > "logs/$n.log" ;;
              *) sudo cat "$f" > "logs/$n.log" ;;
            esac
          done
          for f in logs/*.log; do echo "=== $f"; tail -n 150 "$f"; done

      - name: Upload failed build log
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/

      - name: Export signed closure
        id: export
        env:
          OUT: ${{ steps.build.outputs.out }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          name="ayugram-desktop-$V-x86_64-linux.nar.xz"
          guix gc -R "$OUT" > closure.txt
          wc -l closure.txt
          guix archive --export -r "$OUT" | xz -T0 -6 > "$name"
          ls -l "$name"
          size=$(stat -c %s "$name")
          mkdir -p dist
          if [ "$size" -gt 2000000000 ]; then
            split -b 1900M -d -a 2 "$name" "dist/$name.part"
          else
            mv "$name" dist/
          fi
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.build.outputs.out }}
          V: ${{ steps.ver.outputs.version }}
          MINUTES: ${{ steps.build.outputs.minutes }}
        run: |
          tag="v$V"
          commit=$(sed -n 's/^ *(commit "\([0-9a-f]*\)").*/\1/p' channels-lock.scm)
          {
            echo "AyuGram Desktop $V for GNU Guix (x86_64-linux)."
            echo
            echo "Store path:"
            echo
            echo '```'
            echo "$OUT"
            echo '```'
            echo
            echo "Built with Guix commit $commit from channels-lock.scm, repo commit $GITHUB_SHA."
            echo "Build step time: $MINUTES min."
            echo
            echo "The nar holds the full closure, compressed with xz and signed with signing-key.pub."
            if ls dist/*.part* >/dev/null 2>&1; then
              echo "It is split in parts; join them with cat before importing."
            fi
            echo
            echo "Install:"
            echo
            echo '```'
            echo "sudo guix archive --authorize < signing-key.pub"
            if ls dist/*.part* >/dev/null 2>&1; then
              echo "cat ayugram-desktop-$V-x86_64-linux.nar.xz.part* | xz -d | sudo guix archive --import"
            else
              echo "xz -d < ayugram-desktop-$V-x86_64-linux.nar.xz | sudo guix archive --import"
            fi
            echo "guix package -i $OUT"
            echo '```'
            echo
            echo "SHA256:"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          cp signing-key.pub dist/
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --title "AyuGram Desktop $V" \
              --notes-file notes.md --target "$GITHUB_SHA" dist/*
          fi
